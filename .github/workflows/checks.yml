name: checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m pip install --no-deps -e '.[dev]'
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m scripts.export_contracts --check
      - run: .venv/bin/python -m pip wheel . --no-deps --wheel-dir dist
      - run: .venv/bin/python -m pip install --no-deps --target data/wheel-import dist/governloom-*.whl
      - run: PYTHONPATH=data/wheel-import .venv/bin/python -c "import governloom.delivery, governloom.outbox, governloom.auth, governloom.detectors, governloom.operations, governloom.webhooks, governloom.calibration, governloom.contract, governloom.otel, governloom.outcomes, governloom.recovery, governloom.discovery, governloom.explorer, governloom.discovered_hook; assert 'wheel-import' in governloom.discovery.__file__; assert governloom.__version__ == '0.6.0'"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m pip install --no-deps -e '.[dev]'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            web/test-results
            docs/screenshots
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock -r examples/requirements.txt
      - run: .venv/bin/python -m pip install --no-deps -e '.[dev]'
      - run: .venv/bin/python -m pytest -q tests/test_examples.py
      - run: .venv/bin/python -m examples.quickstart --check --headless --directory data/ci-quickstart
      - run: .venv/bin/python -m examples.discovery_testbed --directory data/ci-discovery
      - run: .venv/bin/python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-model-quickstart
          path: |
            data/ci-quickstart/report.json
            data/ci-discovery/report.json
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m pip install --no-deps -e '.[dev]'
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run build
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript
      - run: .venv/bin/python -m pytest -q tests/test_async_hook.py tests/test_typescript_http.py tests/test_otel.py
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_onboarding.py --directory data/ci-onboarding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-install-report
          path: data/ci-onboarding/report.json
      - run: docker build -t governloom-ci .
      - run: docker run -d --name governloom-ci --read-only --tmpfs /tmp:rw,noexec,nosuid --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8000:8000 governloom-ci
      - run: |
          for attempt in $(seq 1 30); do
            if docker exec governloom-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=1).read()"; then break; fi
            sleep 1
          done
          docker exec -i governloom-ci python - create < scripts/container_smoke.py
          docker restart governloom-ci
          for attempt in $(seq 1 30); do
            if docker exec governloom-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=1).read()"; then break; fi
            sleep 1
          done
          docker exec -i governloom-ci python - restart < scripts/container_smoke.py
      - run: docker rm -fv governloom-ci
        if: always()
