name: Developer problem or feature
description: Describe a real integration or governance problem
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected AI workflow
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired behavior and how it could be verified
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Modality, language, deployment, latency and privacy constraints
