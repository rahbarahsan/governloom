name: checks
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m pip install --no-deps -e '.[dev]'
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m pip check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m pip install --no-deps -e '.[dev]'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            web/test-results
            docs/screenshots
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock -r examples/requirements.txt
      - run: .venv/bin/python -m pip install --no-deps -e '.[dev]'
      - run: .venv/bin/python -m pytest -q tests/test_examples.py
      - run: .venv/bin/python -m pip check
