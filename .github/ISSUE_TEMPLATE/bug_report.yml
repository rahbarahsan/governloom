name: Bug report
description: Report a reproducible software or integration failure
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities follow SECURITY.md. Exclude credentials, private prompts and customer data."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal sanitized reproduction
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: GovernLoom release/commit, OS, Python/Node and integration type
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant sanitized evidence and unavailable states
